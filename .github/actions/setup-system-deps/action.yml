name: Setup system deps
description: >-
   Install the canvas/native runtime deps CI needs (cairo/pango stack, fd,
   ripgrep, imagemagick). No-op on the preloaded omp-kata runner image, which
   already ships them; self-heals on a stock runner by installing via apt.

runs:
   using: composite
   steps:
      - name: Install system deps (skip when preloaded)
        shell: bash
        run: |
           # The preloaded omp-kata runner image bakes these in. Detect that
           # and skip the apt round-trip; otherwise install the exact same set so
           # stock runners (and any future host) still work.
           if command -v fd >/dev/null 2>&1 \
              && command -v rg >/dev/null 2>&1 \
              && command -v magick >/dev/null 2>&1 \
              && pkg-config --exists cairo pango 2>/dev/null; then
             echo "System deps already present (preloaded runner image); skipping apt."
             exit 0
           fi
           sudo apt-get update
           # The canvas/native stack the workspace tests need, plus headful
           # Chromium's runtime deps (puppeteer's Ubuntu set): the headless
           # suites run without the latter, but the visible-tab suite
           # (browser-tab-worker-startup) needs the full X11/GTK stack on a
           # stock runner — the preloaded omp-kata image ships it all.
           sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick \
              libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 \
              libgtk-3-0 libnspr4 libnss3 libxcomposite1 libxdamage1 libxfixes3 \
              libxkbcommon0 libxrandr2 libxshmfence1
           sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
           sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      - name: Provide a virtual display (visible browser tests)
        shell: bash
        run: |
           # Headful Chromium tests (browser-tab-worker-startup's visible-tab
           # suite) need an X display. The preloaded omp-kata image ships one
           # (DISPLAY set); stock GitHub runners do not. Proven shape (E022):
           # start Xvfb here and export DISPLAY via GITHUB_ENV — the daemon
           # survives into the consuming step, and the Chrome runtime libs
           # installed above let the headful launch complete.
           if [ -n "${DISPLAY:-}" ]; then
             echo "DISPLAY already set ($DISPLAY); skipping Xvfb."
             exit 0
           fi
           if ! command -v Xvfb >/dev/null 2>&1; then
             if ! command -v apt-get >/dev/null 2>&1; then
               echo "::warning::No Xvfb and no apt-get — visible browser tests will fail on this host."
               exit 0
             fi
             sudo apt-get update
             sudo apt-get install -y xvfb
           fi
           sudo Xvfb :99 -screen 0 1920x1080x24 -ac >/dev/null 2>&1 &
           sleep 2
           echo "DISPLAY=:99" >> "$GITHUB_ENV"
           echo "Started Xvfb on :99"
