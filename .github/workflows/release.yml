name: OpenKai release

run-name: Release OpenKai ${{ inputs.version }}

# The canonical public repository owns the draft, GitHub Release, provenance,
# npm OIDC identity, and Homebrew cutover. The executable source is handed off
# as a SHA-256-verified archive from the private source repository; this avoids
# pretending two divergent Git histories can be fast-forwarded into one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version from the prepared OpenKai source handoff
        required: true
        type: string
      release_exception:
        description: Explicit release exception to publish verbatim in the notes
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: openkai-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate source handoff
    runs-on: ubuntu-22.04
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      archive-sha256: ${{ steps.source.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: source
        uses: ./.github/actions/materialize-openkai-source
        with:
          version: ${{ inputs.version }}
          mode: capture
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - name: Assert one public product version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const version = process.env.EXPECTED_VERSION;
          if (!/^0\.1\.(?:0|[1-9]\d*)$/.test(version)) {
            throw new Error(`invalid OpenKai release version: ${version}`);
          }
          const engine = JSON.parse(fs.readFileSync("packages/coding-agent/package.json", "utf8"));
          const wrapper = JSON.parse(fs.readFileSync("packaging/npm-openkai/package.json", "utf8"));
          const brand = fs.readFileSync("packages/coding-agent/src/openkai/brand.ts", "utf8");
          if (
            engine.version !== version ||
            wrapper.version !== version ||
            wrapper.dependencies?.["@kaidera/openkai-engine"] !== version ||
            !brand.includes(`export const PRODUCT_VERSION = "${version}";`)
          ) {
            throw new Error("engine, wrapper, wrapper dependency, and runtime stamp must share one product version");
          }
          NODE
      - name: Validate publish contract without publishing
        run: |
          bun install --frozen-lockfile
          bun scripts/ci-release-publish.ts --scope kaidera --dry-run
  native_addons:
    name: Build release native addons
    needs: validate
    outputs:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      archive-sha256: ${{ needs.validate.outputs.archive-sha256 }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/materialize-openkai-source
        with:
          version: ${{ inputs.version }}
          expected-source-sha: ${{ needs.validate.outputs.source-sha }}
          expected-archive-sha256: ${{ needs.validate.outputs.archive-sha256 }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - uses: bazelbuild/setup-bazelisk@v3
      - run: bun install --frozen-lockfile
      - name: Prepare hosted Linux native build space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: bash scripts/ci-prepare-linux-native-space.sh
      - id: cache
        uses: ./.github/actions/bazel-cache
        with:
          scope: release-linux
      - name: Build native addons one target at a time
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          for target in \
            natives-win32-x64-baseline \
            natives-linux-arm64 \
            natives-linux-musl-arm64 \
            natives-linux-musl-x64-baseline \
            natives-linux-x64-baseline \
            natives-linux-x64-modern; do
            bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:$target"
          done
          bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build //:natives-linux-all
      - name: Save Bazel disk cache
        if: steps.cache.outputs.save-needed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/omp-bazel-disk
            ~/.cache/omp-bazel-repo
          key: ${{ steps.cache.outputs.cache-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-addons
          path: bazel-bin/natives-*/*.node
          if-no-files-found: error
          retention-days: 1

  release_binary:
    name: Build release binary (${{ matrix.target_id }})
    needs: native_addons
    outputs:
      source-sha: ${{ needs.native_addons.outputs.source-sha }}
      archive-sha256: ${{ needs.native_addons.outputs.archive-sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target_id: linux-x64
            binary_path: packages/coding-agent/binaries/openkai-linux-x64
            native_targets: linux-x64-baseline linux-x64-modern
          - os: ubuntu-22.04
            platform: linux
            libc: musl
            arch: x64
            target_id: linux-musl-x64
            binary_path: packages/coding-agent/binaries/openkai-linux-musl-x64
            native_targets: linux-musl-x64-baseline
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target_id: linux-arm64
            binary_path: packages/coding-agent/binaries/openkai-linux-arm64
            native_targets: linux-arm64
          - os: ubuntu-24.04-arm
            platform: linux
            libc: musl
            arch: arm64
            target_id: linux-musl-arm64
            binary_path: packages/coding-agent/binaries/openkai-linux-musl-arm64
            native_targets: linux-musl-arm64
          - os: ubuntu-22.04
            platform: win32
            arch: x64
            target_id: win32-x64
            binary_path: packages/coding-agent/binaries/openkai-windows-x64.exe
            native_targets: win32-x64-baseline
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/materialize-openkai-source
        with:
          version: ${{ inputs.version }}
          expected-source-sha: ${{ needs.native_addons.outputs.source-sha }}
          expected-archive-sha256: ${{ needs.native_addons.outputs.archive-sha256 }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/native-artifacts
        with:
          targets: ${{ matrix.native_targets }}
      - name: Build release binary
        env:
          RELEASE_TARGETS: ${{ matrix.target_id }}
        run: bun run ci:release:build-binaries
      - name: Smoke release binary
        if: matrix.platform != 'win32' && matrix.libc != 'musl'
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
      - name: Smoke musl release binary on Alpine
        if: matrix.libc == 'musl'
        run: |
          binary="$(realpath "${{ matrix.binary_path }}")"
          docker run --rm -v "$binary:/usr/local/bin/openkai:ro" alpine:3.22 sh -ec '
            apk add --no-cache libstdc++ libgcc >/dev/null
            runtime_dir="$(mktemp -d)"
            HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" openkai --version
            HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" openkai --smoke-test
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openkai-binary-${{ matrix.target_id }}
          path: ${{ matrix.binary_path }}

  release_binary_darwin:
    name: Build release binary (${{ matrix.target_id }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target_id: darwin-x64
            binary_path: packages/coding-agent/binaries/openkai-darwin-x64
            native_targets: darwin-x64-baseline
          - os: macos-14
            target_id: darwin-arm64
            binary_path: packages/coding-agent/binaries/openkai-darwin-arm64
            native_targets: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/materialize-openkai-source
        with:
          version: ${{ inputs.version }}
          expected-source-sha: ${{ needs.validate.outputs.source-sha }}
          expected-archive-sha256: ${{ needs.validate.outputs.archive-sha256 }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - uses: bazelbuild/setup-bazelisk@v3
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/bazel-natives
        with:
          targets: ${{ matrix.native_targets }}
          cache-scope: release-${{ matrix.target_id }}
      - name: Build release binary
        env:
          RELEASE_TARGETS: ${{ matrix.target_id }}
        run: bun run ci:release:build-binaries
      - name: Smoke release binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openkai-binary-${{ matrix.target_id }}
          path: ${{ matrix.binary_path }}

  release_assets:
    name: Stage signed release assets
    needs: [release_binary, release_binary_darwin]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/materialize-openkai-source
        with:
          version: ${{ inputs.version }}
          expected-source-sha: ${{ needs.release_binary.outputs.source-sha }}
          expected-archive-sha256: ${{ needs.release_binary.outputs.archive-sha256 }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-release-notes.ts "v${{ inputs.version }}"
      - name: Record source provenance and release exception
        env:
          RELEASE_EXCEPTION: ${{ inputs.release_exception }}
        run: |
          source_repository=$(SOURCE_PROVENANCE=./.openkai-source-provenance.json node -e "process.stdout.write(require(process.env.SOURCE_PROVENANCE).source.repository)")
          source_tag=$(SOURCE_PROVENANCE=./.openkai-source-provenance.json node -e "process.stdout.write(require(process.env.SOURCE_PROVENANCE).source.tag)")
          source_sha=$(SOURCE_PROVENANCE=./.openkai-source-provenance.json node -e "process.stdout.write(require(process.env.SOURCE_PROVENANCE).source.sha)")
          release_exception=$(RELEASE_EXCEPTION="$RELEASE_EXCEPTION" SOURCE_PROVENANCE=./.openkai-source-provenance.json node -e "const p = require(process.env.SOURCE_PROVENANCE); process.stdout.write(process.env.RELEASE_EXCEPTION || p.releaseException || '')")
          {
            printf "\n\n## Build source\n\n"
            printf -- "- \`%s@%s\` (\`%s\`, subtree \`products/openkai\`)\n" "$source_repository" "$source_sha" "$source_tag"
            if [ -n "${release_exception:-}" ]; then
              printf "\n## Release exception\n\n%s\n" "$release_exception"
            fi
          } >> release-notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: openkai-binary-*
          path: packages/coding-agent/binaries
          merge-multiple: true
      - name: Build browser relay artifact
        run: bun run --cwd packages/browser-relay build
      - name: Generate signed witnessed-upgrade manifest
        env:
          OPENKAI_RELEASE_PRIVATE_KEY: ${{ secrets.OPENKAI_RELEASE_PRIVATE_KEY }}
        run: bun packages/coding-agent/scripts/ci-release-manifest.ts "v${{ inputs.version }}" latest.json
      - name: Generate release checksums
        run: |
          bun run ci:release:checksums SHA256SUMS.txt \
            packages/coding-agent/binaries/openkai-* \
            packages/browser-relay/dist/openkai-browser-relay-extension.zip \
            latest.json \
            LICENSE \
            THIRD-PARTY-NOTICES.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/coding-agent/binaries/openkai-*
            packages/browser-relay/dist/openkai-browser-relay-extension.zip
      - name: Stage assets and notes on the canonical draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          gh release upload "$TAG" \
            packages/coding-agent/binaries/openkai-* \
            packages/browser-relay/dist/openkai-browser-relay-extension.zip \
            latest.json \
            LICENSE \
            THIRD-PARTY-NOTICES.txt \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenKai v${VERSION}" \
            --notes-file release-notes.md
      - name: Prepare public Homebrew formula before retiring private source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          mkdir -p openkai-formula
          bun scripts/ci-update-openkai-brew-formula.ts "$TAG" \
            --version "${VERSION}" \
            --out openkai-formula/openkai.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openkai-formula
          path: openkai-formula/openkai.rb
          if-no-files-found: error
          retention-days: 1

  native_probe:
    name: Native probe (${{ matrix.target_id }})
    needs: release_assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_id: linux-x64
          - os: macos-14
            target_id: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download the exact pre-publish binary (retried once, infra-class failures only)
        env:
          GH_TOKEN: ${{ github.token }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 10
          # gh run download is a shell command, so it is retry-wrappable;
          # actions/download-artifact is not (nick-fields/retry only wraps
          # `command:`, never a `uses:` step). A failure here is an infra
          # class (artifact missing/network) by construction -- it happens
          # before the probe ever runs, so this retry can never mask a real
          # `verdict: FAIL` from probe-native.py/probe-native-successor.py,
          # which is never wrapped in retry (EPIC_SPEC.md "Risks and rollback").
          command: |
            rm -rf probe-artifact
            gh run download ${{ github.run_id }} \
              --repo ${{ github.repository }} \
              --name openkai-binary-${{ matrix.target_id }} \
              --dir probe-artifact
      - name: Make the downloaded binary executable
        run: chmod +x probe-artifact/openkai-${{ matrix.target_id }}
      - name: Boundary probe (dotenv isolation, all flags disabled)
        run: |
          python3 scripts/ci-native-probe/probe-native.py \
            --binary probe-artifact/openkai-${{ matrix.target_id }} \
            --case ci-${{ matrix.target_id }}-all-disabled
      - name: Successor probe (self-re-entry boundary)
        run: |
          python3 scripts/ci-native-probe/probe-native-successor.py \
            --binary probe-artifact/openkai-${{ matrix.target_id }} \
            --case ci-${{ matrix.target_id }}-successor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-probe-${{ matrix.target_id }}
          path: |
            scripts/ci-native-probe/runs/ci-${{ matrix.target_id }}-all-disabled/result.json
            scripts/ci-native-probe/runs/ci-${{ matrix.target_id }}-all-disabled/invocation.json
            scripts/ci-native-probe/successor-runs/ci-${{ matrix.target_id }}-successor/result.json
            scripts/ci-native-probe/successor-runs/ci-${{ matrix.target_id }}-successor/invocation.json
          if-no-files-found: error
          retention-days: 90

  release_npm:
    name: Publish coordinated npm packages
    needs: [release_assets, native_addons]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/materialize-openkai-source
        with:
          version: ${{ inputs.version }}
          expected-source-sha: ${{ needs.native_addons.outputs.source-sha }}
          expected-archive-sha256: ${{ needs.native_addons.outputs.archive-sha256 }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.17.0
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/native-artifacts
        with:
          targets: linux-x64-baseline linux-x64-modern
      - name: Publish engine before wrapper
        run: bun scripts/ci-release-publish.ts --scope kaidera

  publish_release:
    name: Publish canonical release
    needs: [release_assets, release_npm, native_probe]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Remove private source handoff and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          gh release delete-asset "$TAG" "openkai-source-${TAG}.tar.gz" --repo "$GITHUB_REPOSITORY" --yes
          gh release delete-asset "$TAG" "openkai-source-${TAG}.provenance.json" --repo "$GITHUB_REPOSITORY" --yes
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  verify_published_digest:
    name: Verify published asset digests
    # Non-blocking confirmation, not a second gate: EPIC_SPEC.md open question 1,
    # resolved -- native_probe already gates publish_release on the pre-publish
    # artifact (stronger: catches a build defect before any user can see it).
    # This job catches a different failure class (upload/CDN corruption between
    # the staged draft and the now-public release) with no second probe run --
    # a pure digest comparison against the manifest release_assets already
    # staged. It never blocks update_installer/release_brew.
    needs: publish_release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download the published release assets and their checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          mkdir -p published
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published \
            --pattern "openkai-*" \
            --pattern "latest.json" \
            --pattern "LICENSE" \
            --pattern "THIRD-PARTY-NOTICES.txt" \
            --pattern "SHA256SUMS.txt"
      - name: Recompute digests of the truly-published bytes and compare
        run: |
          cd published
          sha256sum --check --strict SHA256SUMS.txt

  update_installer:
    name: Update canonical installer default
    needs: publish_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
      - name: Update and verify the canonical installer
        run: |
          node scripts/update-installer-version.mjs update "${{ inputs.version }}"
          node scripts/update-installer-version.mjs verify "${{ inputs.version }}"
      - name: Commit the installer update when needed
        run: |
          if git diff --quiet -- scripts/install.sh; then
            echo "installer already points at v${VERSION}"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "install: default to v${VERSION}" -- scripts/install.sh
            git push origin HEAD:main
          fi
      - name: Verify the installer on canonical main
        run: |
          git fetch --quiet origin main
          git show origin/main:scripts/install.sh > "$RUNNER_TEMP/install.sh"
          node scripts/update-installer-version.mjs verify "${{ inputs.version }}" "$RUNNER_TEMP/install.sh"

  release_brew:
    name: Update Kaidera Homebrew tap
    needs: update_installer
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Kaidera-AI/homebrew-tap
          ssh-key: ${{ secrets.KAIDERA_TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openkai-formula
          path: homebrew-tap/Formula
      - name: Install prepared OpenKai formula
        env:
          TAG: v${{ inputs.version }}
        run: |
          cd homebrew-tap
          if git diff --quiet -- Formula/openkai.rb; then
            echo "formula already up to date for ${VERSION}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "openkai ${VERSION} (${TAG})" -- Formula/openkai.rb
          git push origin HEAD:main
